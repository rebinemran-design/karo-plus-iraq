<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karo Plus Iraq 👑</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            text-align: center;
        }
        .logo {
            font-size: 60px;
            margin: 20px 0;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        .username {
            background: rgba(255,255,255,0.2);
            padding: 10px 20px;
            border-radius: 20px;
            display: inline-block;
            margin: 15px 0;
        }
        .btn {
            background: white;
            color: #764ba2;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin: 10px 0;
            transition: 0.3s;
        }
        .btn:hover {
            transform: scale(1.05);
        }
        .card {
            background: rgba(255,255,255,0.15);
            padding: 20px;
            border-radius: 16px;
            margin: 20px 0;
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">👑</div>
        <h1>Karo Plus Iraq</h1>
        <div class="username" id="user">بەخێربێیت</div>
        
        <div class="card">
            <h3>خزمەتگوزاریەکانمان</h3>
            <p style="margin: 15px 0; opacity: 0.9;">باشترین کوالێتی، خێراترین گەیاندن</p>
        </div>

        <button class="btn" onclick="sendData()">
            🛒 داواکاری نوێ
        </button>
        
        <button class="btn" onclick="contact()">
            📞 پەیوەندی بە ئێمە
        </button>

        <button class="btn" onclick="closeApp()">
            ❌ داخستن
        </button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        // نیشاندانی ناوی بەکارهێنەر
        if (tg.initDataUnsafe.user) {
            document.getElementById('user').innerText = 
                `سڵاو ${tg.initDataUnsafe.user.first_name} 👑`;
        }

        function sendData() {
            tg.sendData("order_new");
            tg.close();
        }

        function contact() {
            tg.openTelegramLink("https://t.me/KaroPlusSupport");
        }

        function closeApp() {
            tg.close();
        }

        // گۆڕینی ڕەنگی Theme
        tg.setHeaderColor('#667eea');
        tg.setBackgroundColor('#667eea');
    </script>
</body>
</html>
