<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KARO PLUS V12 👑</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Noto Sans Arabic', sans-serif; }
    body { background: #0A0E27; background-image: radial-gradient(circle at 20% 50%, rgba(255, 215, 0, 0.15) 0%, transparent 50%), radial-gradient(circle at 80% 80%, rgba(0, 212, 255, 0.15) 0%, transparent 50%); min-height: 100vh; }
    @keyframes float3d { 0%, 100% { transform: translateY(0px) rotateX(5deg) rotateY(-5deg); } 50% { transform: translateY(-20px) rotateX(5deg) rotateY(5deg); } }
    @keyframes glowPulse { 0%, 100% { box-shadow: 0 0 20px rgba(255, 215, 0, 0.4); } 50% { box-shadow: 0 0 40px rgba(255, 215, 0, 0.8); } }
    @keyframes shimmer { 0% { background-position: -1000px 0; } 100% { background-position: 1000px 0; } }
   .logo-3d { animation: float3d 6s ease-in-out infinite; }
   .glass { background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05)); backdrop-filter: blur(20px); border: 1px solid rgba(255, 215, 0, 0.3); }
   .gold-text { background: linear-gradient(135deg, #FFD700, #FFA500, #FFD700); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: shimmer 3s linear infinite; font-weight: 900; }
   .card-3d { transition: all 0.4s; }
   .card-3d:hover { transform: translateY(-10px) scale(1.02); animation: glowPulse 2s infinite; }
   .btn-royal { background: linear-gradient(135deg, #FFD700, #FFA500); box-shadow: 0 10px 30px rgba(255, 165, 0, 0.4); }
  </style>
</head>
<body>
  <div class="relative z-10 max-w-md mx-auto p-4 pb-24" id="app">
    <div class="glass card-3d rounded-3xl p-6 mb-6 text-center logo-3d">
      <img src="https://i.imgur.com/8tG8ZqN.png" class="w-24 h-24 mx-auto mb-3 rounded-2xl" alt="KP">
      <h1 class="text-5xl gold-text mb-2">KARO PLUS V12</h1>
      <p class="text-cyan-400 text-sm font-bold mb-4">Your Career, Elevated</p>
      <div class="glass px-4 py-2 rounded-full inline-block">
        <span class="text-yellow-400">👑</span>
        <span class="text-white font-bold" id="status">VIP</span>
      </div>
    </div>

    <div class="glass card-3d rounded-2xl p-4 mb-4">
      <input type="text" id="search" placeholder="🔍 گەڕان بۆ کار..." class="w-full bg-transparent text-white p-3 rounded-xl border border-yellow-500/30">
    </div>

    <div id="jobs-container"></div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    const API_URL = 'https://karoplus-bot.onrender.com/api';

    async function loadJobs() {
      try {
        const res = await fetch(`${API_URL}/jobs`);
        const jobs = await res.json();
        renderJobs(jobs);
      } catch(e) {
        document.getElementById('jobs-container').innerHTML = '<div class="text-center text-gray-400">هەڵە ڕوویدا</div>';
      }
    }

    function renderJobs(jobs) {
      const container = document.getElementById('jobs-container');
      container.innerHTML = jobs.map(job => `
        <div class="glass card-3d rounded-2xl p-5 mb-4">
          <div class="flex justify-between items-start mb-3">
            <div>
              <h3 class="text-xl font-bold text-white mb-1">${job.title}</h3>
              <p class="text-yellow-400">${job.company}</p>
            </div>
            ${job.is_vip? '<span class="bg-yellow-500 text-black px-2 py-1 rounded text-xs">VIP</span>' : ''}
          </div>
          <div class="flex gap-2 mb-3 text-sm">
            <span class="text-gray-400">📍 ${job.location}</span>
            <span class="text-green-400">💰 ${job.salary}</span>
          </div>
          <p class="text-gray-300 text-sm mb-4">${job.desc.substring(0,100)}...</p>
          <div class="flex gap-2">
            <button onclick="apply(${job.id})" class="btn-royal flex-1 py-2 rounded-xl font-bold">داواکاری</button>
            <button onclick="chat(${job.posted_by})" class="glass px-4 py-2 rounded-xl">💬</button>
          </div>
          <div class="mt-3 pt-3 border-t border-gray-700 text-xs">
            ${job.whatsapp? `<a href="https://wa.me/${job.whatsapp}" class="text-green-400">📱 واتساپ</a>` : ''}
            ${job.email? `<a href="mailto:${job.email}" class="text-blue-400 mr-3">📧 ئیمەیل</a>` : ''}
          </div>
        </div>
      `).join('');
    }

    function apply(jobId) {
      tg.showAlert('داواکاری نێردرا! ✅');
    }

    function chat(userId) {
      tg.openTelegramLink(`https://t.me/KaroPlusbot?start=chat_${userId}`);
    }

    document.getElementById('search').oninput = async (e) => {
      const res = await fetch(`${API_URL}/jobs`);
      const jobs = await res.json();
      const filtered = jobs.filter(j =>
        j.title.includes(e.target.value) ||
        j.company.includes(e.target.value)
      );
      renderJobs(filtered);
    };

    loadJobs();
  </script>
</body>
</html>
