<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KARO PLUS 👑 Royal Jobs</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Noto Sans Arabic', sans-serif; }
    body { background: #0A0E27; background-image: radial-gradient(circle at 20% 50%, rgba(255, 215, 0, 0.1) 0%, transparent 50%), radial-gradient(circle at 80% 80%, rgba(0, 212, 255, 0.1) 0%, transparent 50%); overflow-x: hidden; }
    @keyframes float3d { 0%, 100% { transform: translateY(0px) rotateX(5deg) rotateY(-5deg); } 50% { transform: translateY(-20px) rotateX(5deg) rotateY(5deg); } }
    @keyframes glowPulse { 0%, 100% { box-shadow: 0 0 20px rgba(255, 215, 0, 0.4), 0 0 40px rgba(255, 215, 0, 0.2); } 50% { box-shadow: 0 0 40px rgba(255, 215, 0, 0.8), 0 0 80px rgba(255, 215, 0, 0.4); } }
    @keyframes shimmer { 0% { background-position: -1000px 0; } 100% { background-position: 1000px 0; } }
   .logo-3d { animation: float3d 6s ease-in-out infinite; transform-style: preserve-3d; perspective: 1000px; }
   .glass-royal { background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05)); backdrop-filter: blur(20px) saturate(180%); border: 1px solid rgba(255, 215, 0, 0.3); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.2); }
   .gold-text { background: linear-gradient(135deg, #FFD700 0%, #FFA500 25%, #FFD700 50%, #FFA500 75%, #FFD700 100%); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: shimmer 3s linear infinite; font-weight: 900; }
   .card-3d { transform-style: preserve-3d; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
   .card-3d:hover { transform: translateY(-10px) rotateX(5deg) scale(1.02); animation: glowPulse 2s ease-in-out infinite; }
   .btn-royal { background: linear-gradient(135deg, #FFD700, #FFA500, #FF8C00); background-size: 200% 200%; animation: shimmer 3s ease infinite; box-shadow: 0 10px 30px rgba(255, 165, 0, 0.4); transition: all 0.3s; }
   .btn-royal:active { transform: scale(0.95) translateZ(-10px); }
   .particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
   .particle { position: absolute; width: 3px; height: 3px; background: #FFD700; border-radius: 50%; animation: particleFloat 15s infinite; opacity: 0.3; }
    @keyframes particleFloat { 0%, 100% { transform: translateY(0) translateX(0); opacity: 0; } 10% { opacity: 0.5; } 90% { opacity: 0.5; } 100% { transform: translateY(-100vh) translateX(100px); opacity: 0; } }
  </style>
</head>
<body>
  <div class="particles" id="particles"></div>
  <div class="relative z-10 max-w-md mx-auto p-4 pb-24">
    <div class="glass-royal card-3d rounded-3xl p-6 mb-6 text-center logo-3d">
      <img src="https://i.imgur.com/8tG8ZqN.png" class="w-24 h-24 mx-auto mb-3" alt="KARO PLUS">
      <h1 class="text-5xl gold-text mb-2">KARO PLUS</h1>
      <div class="flex items-center justify-center gap-2 mb-3">
        <div class="h-px w-12 bg-gradient-to-r from-transparent to-yellow-500"></div>
        <p class="text-cyan-400 text-sm font-bold">Your Career, Elevated</p>
        <div class="h-px w-12 bg-gradient-to-l from-transparent to-yellow-500"></div>
      </div>
      <div class="flex justify-center gap-2 mt-4">
        <div class="glass-royal px-4 py-2 rounded-full card-3d"><span class="text-xs text-yellow-400">👑 شاهانە</span></div>
        <div class="glass-royal px-4 py-2 rounded-full card-3d"><span class="text-xs text-cyan-400">⏳ 7 ڕۆژ</span></div>
        <div class="glass-royal px-4 py-2 rounded-full card-3d"><span class="text-xs text-green-400">👥 0/2</span></div>
      </div>
    </div>
    <div class="space-y-4" id="jobs"></div>
    <div class="fixed bottom-0 left-0 right-0 glass-royal border-t border-yellow-500/30 p-4 z-50">
      <div class="max-w-md mx-auto flex justify-around">
        <button class="flex flex-col items-center card-3d"><div class="text-3xl gold-text">🏠</div><span class="text-xs mt-1 text-yellow-400 font-bold">سەرەکی</span></button>
        <button class="flex flex-col items-center card-3d"><div class="text-3xl text-gray-500">🔍</div><span class="text-xs mt-1 text-gray-500">گەڕان</span></button>
        <button class="flex flex-col items-center card-3d"><div class="text-3xl text-gray-500">💬</div><span class="text-xs mt-1 text-gray-500">چات</span></button>
        <button class="flex flex-col items-center card-3d"><div class="text-3xl text-gray-500">👤</div><span class="text-xs mt-1 text-gray-500">پرۆفایل</span></button>
      </div>
    </div>
  </div>
  <script>
    Telegram.WebApp.ready(); Telegram.WebApp.expand(); Telegram.WebApp.setHeaderColor('#0A0E27'); Telegram.WebApp.setBackgroundColor('#0A0E27');
    const particlesContainer = document.getElementById('particles');
    for (let i = 0; i < 30; i++) { const particle = document.createElement('div'); particle.className = 'particle'; particle.style.left = Math.random() * 100 + '%'; particle.style.animationDelay = Math.random() * 15 + 's'; particle.style.animationDuration = (Math.random() * 10 + 10) + 's'; particlesContainer.appendChild(particle); }
    const jobs = [{title:"Senior Full Stack",company:"Tech Iraq",loc:"هەولێر",salary:"$2500",type:"VIP"},{title:"Marketing Manager",company:"Digital Agency",loc:"سلێمانی",salary:"$1800",type:"Normal"}];
    document.getElementById('jobs').innerHTML = jobs.map(job => `
      <div class="glass-royal card-3d rounded-2xl p-5 relative overflow-hidden">
        <div class="absolute top-0 right-0 w-32 h-32 bg-yellow-500/20 rounded-full blur-3xl"></div>
        <div class="relative">
          <div class="flex justify-between items-start mb-4">
            <div class="flex-1">
              <div class="flex items-center gap-2 mb-1"><h3 class="text-2xl font-black gold-text">${job.title}</h3>${job.type==='VIP'?'<span class="animate-pulse">🔥</span>':''}</div>
              <p class="text-gray-400 text-sm flex items-center gap-1"><span>🏢</span> ${job.company}</p>
            </div>
            ${job.type==='VIP'?'<div class="px-3 py-1 bg-gradient-to-r from-yellow-500 to-orange-500 rounded-full text-xs font-black text-black card-3d">👑 VIP</div>':''}
          </div>
          <div class="grid grid-cols-3 gap-2 mb-4">
            <div class="glass-royal rounded-xl p-2 text-center card-3d"><div class="text-lg">📍</div><div class="text-xs text-gray-400">${job.loc}</div></div>
            <div class="glass-royal rounded-xl p-2 text-center card-3d"><div class="text-lg">💰</div><div class="text-xs gold-text font-bold">${job.salary}</div></div>
            <div class="glass-royal rounded-xl p-2 text-center card-3d"><div class="text-lg">⏰</div><div class="text-xs text-gray-400">Full-time</div></div>
          </div>
          <button onclick="Telegram.WebApp.HapticFeedback.impactOccurred('heavy');Telegram.WebApp.showAlert('💎 داواکاریت نێردرا!')" class="w-full py-4 btn-royal rounded-xl font-black text-black text-lg card-3d">💎 داواکاری پێشکەش بکە</button>
        </div>
      </div>`).join('');
    document.querySelectorAll('.card-3d').forEach(card => { card.addEventListener('mousemove', (e) => { const rect = card.getBoundingClientRect(); const x = e.clientX - rect.left; const y = e.clientY - rect.top; const centerX = rect.width / 2; const centerY = rect.height / 2; const rotateX = (y - centerY) / 10; const rotateY = (centerX - x) / 10; card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateZ(10px)`; }); card.addEventListener('mouseleave', () => { card.style.transform = 'perspective(1000px) rotateX(0) rotateY(0) translateZ(0)'; }); });
  </script>
</body>
</html>
